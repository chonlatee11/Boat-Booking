name: boatbooking

services:
  gateway:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      retries: 12
    stop_grace_period: 20s

  kong:
    profiles: [app]
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
    depends_on:
      gateway:
        condition: service_healthy

  web:
    profiles: [web]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - ../gen:/gen:ro
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.9.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.4.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 12

volumes:
  tempo_data:
