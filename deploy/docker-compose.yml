name: boatbooking

services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  postgres-init:
    image: postgres:17.9-alpine
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD}
    volumes:
      - ./postgres/init.sh:/init/init.sh:ro
      - ./services.txt:/services.txt:ro
    depends_on:
      postgres:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --smp
      - "1"
      - --memory
      - 1G
      - --mode
      - dev-container
      - --set
      - redpanda.auto_create_topics_enabled=false
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      retries: 24
      start_period: 10s

  redpanda-init:
    image: redpandadata/redpanda:v26.2.3
    entrypoint: ["sh", "/init/topics.sh"]
    environment:
      RPK_BROKERS: redpanda:9092
      SERVICES_FILE: /services.txt
    volumes:
      - ./redpanda/topics.sh:/init/topics.sh:ro
      - ./services.txt:/services.txt:ro
    depends_on:
      redpanda:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9.0.6-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  redpanda-console:
    image: redpandadata/console:v3.12.0
    profiles: [tools]
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "127.0.0.1:8081:8080"

  gateway:
    profiles: [app]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    environment:
      JWT_PUBLIC_KEY_B64: ${JWT_PUBLIC_KEY_B64}
      JWT_ISSUER: ${JWT_ISSUER}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      HTTP_ADDR: ":8080"
      CATALOG_URL: http://catalog:8080
      RELAY_ENABLED: "false"
      CONSUMER_ENABLED: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_FORMAT: json
      ENV: ${ENV}
    healthcheck:
      test: ["CMD", "/service", "-healthcheck"]
      interval: 5s
      retries: 12
    stop_grace_period: 20s
    depends_on:
      otel-collector:
        condition: service_started

  # Partial service: Compose merges this into the identity: block generated
  # by compose-gen (deploy/docker-compose.services.yml, D-24) — build,
  # DATABASE_URL/KAFKA_BROKERS, healthcheck, and depends_on migrate-identity
  # / redpanda-init / otel-collector all come from there. Ports are
  # deliberately never published (AUTH-03 network isolation) — identity is
  # reachable only from other containers on the compose network.
  identity:
    environment:
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64}
      JWT_ISSUER: ${JWT_ISSUER}
      VALKEY_ADDR: valkey:6379
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      SMTP_ADDR: mailpit:1025
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
    depends_on:
      valkey:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Partial service: merges into the catalog: block generated by compose-gen
  # (D-24) — build/DATABASE_URL/KAFKA_BROKERS/healthcheck/depends_on come
  # from there. Adds the S3_*/PHOTO_PUBLIC_BASE_URL env catalog's presigned
  # pier-photo upload needs (D-19); non-secret bucket/CORS settings this
  # documents are in deploy/storage/s3-config.json.
  catalog:
    environment:
      S3_PUBLIC_ENDPOINT: localhost:8333
      S3_REGION: us-east-1
      S3_BUCKET: pier-photos
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PHOTO_PUBLIC_BASE_URL: http://localhost:8333/pier-photos
    depends_on:
      storage-init:
        condition: service_completed_successfully

  # Dev object storage for pier photos (D-19, D-01 storage decision:
  # SeaweedFS, MinIO's community edition is archived). S3 API on
  # 127.0.0.1:8333, browser-facing per catalog's S3_PUBLIC_ENDPOINT.
  # -s3.allowedOrigins is the global CORS config (deploy/storage/
  # s3-config.json documents the same origin/methods/headers).
  storage:
    image: chrislusf/seaweedfs:4.47
    command:
      - server
      - -s3
      - -ip=storage
      - -ip.bind=0.0.0.0
      - -s3.allowedOrigins=http://localhost:3002
    volumes:
      - storage_data:/data
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/healthz"]
      interval: 5s
      retries: 12
      start_period: 10s

  # One-shot: creates the pier-photos bucket (idempotent, exits 0 on
  # re-run), grants the catalog identity read/write/list scoped to that
  # bucket only, and grants anonymous read-object access (no list) so
  # uploaded photos are publicly viewable (T-02-11-02).
  storage-init:
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        # storage's healthcheck only proves the master HTTP port is up; the
        # filer's own gRPC listener (which weed shell's s3.* commands need)
        # can still be a few seconds behind, so retry past the startup race
        # instead of failing on the first "connection refused".
        # IN-08: a shell function instead of building a command string and
        # eval-ing it -- a quote or $(...) in .env's S3_ACCESS_KEY/
        # S3_SECRET_KEY would otherwise run inside this container.
        configure() {
          printf 's3.configure -user=catalog -actions=Read,Write,List -buckets=pier-photos -access_key=%s -secret_key=%s -apply\n' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" | weed shell -master=storage:9333
        }
        i=0
        until configure; do
          i=$$((i + 1))
          if [ "$$i" -ge 15 ]; then
            echo "storage-init: giving up waiting for storage's filer gRPC to accept connections" >&2
            exit 1
          fi
          sleep 2
        done
        if ! (printf 's3.bucket.list\n' | weed shell -master=storage:9333) | grep -q pier-photos; then
          printf 's3.bucket.create -name pier-photos -owner catalog\n' | weed shell -master=storage:9333
        fi
        printf 's3.anonymous.set -bucket pier-photos -access Read\n' | weed shell -master=storage:9333
        echo "storage-init: pier-photos bucket ready (public read, catalog read/write)"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      storage:
        condition: service_healthy

  kong:
    profiles: [app]
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
    depends_on:
      gateway:
        condition: service_healthy

  web:
    profiles: [web]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - ../gen:/gen:ro
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"

  admin:
    profiles: [web]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../apps/admin:/app
      - /app/node_modules
      - ../gen:/gen:ro
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev -- -H 0.0.0.0"
    ports:
      - "127.0.0.1:3002:3002"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  tempo:
    image: grafana/tempo:2.9.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --storage.tsdb.retention.time=3d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:12.4.9
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 12
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  tempo_data:
  loki_data:
  prometheus_data:
  pg_data:
  redpanda_data:
  storage_data:
