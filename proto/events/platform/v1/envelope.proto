syntax = "proto3";

package boatbooking.platform.events.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/chonlatee11/boat-booking/gen/go/platform/v1;platformv1";

// Envelope is the Kafka value wire contract for every domain event published
// by any service. Trace context travels only in the Kafka header
// `traceparent` — it is never duplicated in the envelope body (D-06).
message Envelope {
  string event_id = 1;
  string event_type = 2;
  string aggregate_id = 3;
  google.protobuf.Timestamp occurred_at = 4;
  int32 version = 5;
  google.protobuf.Any payload = 6;
}
