syntax = "proto3";

package boatbooking.catalog.v1;

import "events/catalog/v1/boat.proto";

option go_package = "github.com/chonlatee11/boat-booking/gen/go/catalog/v1;catalogv1";

// CatalogService is the sync API for catalog-owned boats. Reused by the
// gateway BFF and by other services that need boat data without waiting on
// the async BoatUpserted projection.
service CatalogService {
  rpc UpsertBoat(UpsertBoatRequest) returns (UpsertBoatResponse);
  rpc ListBoats(ListBoatsRequest) returns (ListBoatsResponse);

  // Operator management is super_admin only (D-08, AUTH-05).
  rpc UpsertOperator(UpsertOperatorRequest) returns (UpsertOperatorResponse);
  rpc ListOperators(ListOperatorsRequest) returns (ListOperatorsResponse);
  rpc ArchiveOperator(ArchiveOperatorRequest) returns (ArchiveOperatorResponse);

  // Pier creation is super_admin only; pier_admin/staff are scoped to
  // (operator_id, pier_ids) (D-07, D-08, AUTH-05). ListPiers with no claims
  // returns the public projection (CAT-06).
  rpc UpsertPier(UpsertPierRequest) returns (UpsertPierResponse);
  rpc ListPiers(ListPiersRequest) returns (ListPiersResponse);
}

message Boat {
  string boat_id = 1;
  string operator_id = 2;
  string name = 3;
  int32 default_capacity = 4;
  boatbooking.catalog.events.v1.BoatStatus status = 5;
}

// An empty boat_id means create; a non-empty boat_id means update.
// operator_id always comes from the trusted gateway claims, never from the
// request body (D-30).
message UpsertBoatRequest {
  string boat_id = 1;
  string name = 2;
  int32 default_capacity = 3;
  boatbooking.catalog.events.v1.BoatStatus status = 4;
}

message UpsertBoatResponse {
  Boat boat = 1;
}

message ListBoatsRequest {}

message ListBoatsResponse {
  repeated Boat boats = 1;
}

message Operator {
  string operator_id = 1;
  string name = 2;
  bool archived = 3;
}

// An empty operator_id means create; a non-empty operator_id means update.
// Only super_admin may call this (D-08).
message UpsertOperatorRequest {
  string operator_id = 1;
  string name = 2;
}

message UpsertOperatorResponse {
  Operator operator = 1;
}

message ListOperatorsRequest {}

message ListOperatorsResponse {
  repeated Operator operators = 1;
}

message ArchiveOperatorRequest {
  string operator_id = 1;
}

message ArchiveOperatorResponse {
  Operator operator = 1;
}

message Pier {
  string pier_id = 1;
  string operator_id = 2;
  string name_th = 3;
  string name_en = 4;
  double lat = 5;
  double lng = 6;
  string address = 7;
  string opens_at = 8;
  string closes_at = 9;
  bool archived = 10;
}

// An empty pier_id means create (super_admin only, operator_id taken from
// the request); a non-empty pier_id means update (pier_admin/staff scoped
// to their own operator/pier_ids) and the stored operator_id is kept
// unchanged regardless of what the request sends (D-30).
message UpsertPierRequest {
  string pier_id = 1;
  string operator_id = 2;
  string name_th = 3;
  string name_en = 4;
  double lat = 5;
  double lng = 6;
  string address = 7;
  string opens_at = 8;
  string closes_at = 9;
}

message UpsertPierResponse {
  Pier pier = 1;
}

// operator_id is honoured only for super_admin callers (CAT-06/AUTH-05); it
// is ignored for scoped roles and for the public (no-claims) call.
message ListPiersRequest {
  string operator_id = 1;
}

message ListPiersResponse {
  repeated Pier piers = 1;
}
